name: build

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '*.md'
      - 'DESIGN.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned to the same vcpkg revision CommonLibSSE-NG v3.7.0's own CI uses.
  VCPKG_COMMIT: 01b29f6d8212bc845da64773b18665d682f5ab66
  COMMONLIB_REF: v3.7.0
  # This pinned vcpkg predates the x-gha cache provider that run-vcpkg injects.
  VCPKG_BINARY_SOURCES: clear

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout IMR
        uses: actions/checkout@v4
        with:
          path: IMR

      - name: Checkout CommonLibSSE-NG
        uses: actions/checkout@v4
        with:
          repository: CharmedBaryon/CommonLibSSE-NG
          ref: ${{ env.COMMONLIB_REF }}
          path: CommonLibSSE-NG

      - name: Setup vcpkg
        id: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # Explicit classic-mode install.  Errors from this step land in the job
      # annotations, which is far easier to diagnose than CMake's opaque
      # manifest-mode "vcpkg install failed".
      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            fmt:x64-windows spdlog:x64-windows rapidcsv:x64-windows `
            --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Configure
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S IMR -B IMR/build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DIMR_COMMONLIB_DIR="${{ github.workspace }}/CommonLibSSE-NG" `
            -DIMR_DEPS_DIR=""

      - name: Build
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: cmake --build IMR/build --config Release --parallel

      - name: Test (Chinese build)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          & ./IMR/build/Release/InteractiveMusicRadioTests.exe
          if ($LASTEXITCODE -ne 0) { throw "Chinese build tests failed" }

      - name: Test (English build)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          & ./IMR/build/Release/InteractiveMusicRadioTests_en.exe
          if ($LASTEXITCODE -ne 0) { throw "English build tests failed" }

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveMusicRadio-2.3-dlls
          path: |
            IMR/build/Release/InteractiveMusicRadio.dll
            IMR/build/Release/InteractiveMusicRadio_en.dll
            IMR/build/Release/InteractiveMusicRadio.pdb
            IMR/build/Release/InteractiveMusicRadio_en.pdb
          if-no-files-found: error
