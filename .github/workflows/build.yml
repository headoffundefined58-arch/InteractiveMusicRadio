name: build

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '*.md'
      - 'DESIGN.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # MUST match the CommonLibSSE-NG version whose REL::ID set matches the
  # Address Library installed on the target machine. v3.7.0 merged upstream
  # reverse-engineering updates -> new IDs -> "Failed to find the id within
  # the address library" on older versionlib-*.bin. v3.6.0 is the version the
  # known-good 2.2 build used. Never bump without re-validating in game.
  COMMONLIB_REF: v3.6.0

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout IMR
        uses: actions/checkout@v4
        with:
          path: IMR

      - name: Checkout CommonLibSSE-NG
        uses: actions/checkout@v4
        with:
          repository: CharmedBaryon/CommonLibSSE-NG
          ref: ${{ env.COMMONLIB_REF }}
          path: CommonLibSSE-NG

      # The REL::ID numbers compiled into the DLL must exist in the target
      # machine's versionlib-*.bin. Record the exact library version so a
      # mismatch is visible in the run summary / artifact name.
      - name: Record CommonLibSSE-NG version
        shell: pwsh
        run: |
          # v3.6.0 writes project() as a MULTI-LINE block:
          #   project(
          #     CommonLibSSE
          #     LANGUAGES CXX
          #     VERSION 3.6.0
          #   )
          # A single-line 'project(...VERSION...)' regex silently matches nothing.
          $cm = Get-Content 'CommonLibSSE-NG/CMakeLists.txt' -Raw
          $pb = [regex]::Match($cm, 'project\s*\((?<body>[\s\S]*?)\)')
          if (-not $pb.Success) { throw "Cannot find project() block in CommonLibSSE-NG/CMakeLists.txt" }
          $vm = [regex]::Match($pb.Groups['body'].Value, 'VERSION\s+([0-9.]+)')
          if (-not $vm.Success) { throw "Cannot read VERSION from project() block" }
          $ver = $vm.Groups[1].Value
          $sha = (git -C CommonLibSSE-NG rev-parse HEAD).Trim()
          $tag = (git -C CommonLibSSE-NG describe --tags --exact-match 2>$null).Trim()
          if ($tag -and $tag -ne '${{ env.COMMONLIB_REF }}') {
            throw "Checked-out tag '$tag' != pinned REF '${{ env.COMMONLIB_REF }}' - refusing to build with the wrong REL::ID set"
          }
          "COMMONLIB_VERSION=$ver" | Add-Content $env:GITHUB_ENV
          "### Build inputs`n- CommonLibSSE-NG: $ver (tag $tag / $sha)`n- Pinned REF: ${{ env.COMMONLIB_REF }}`n- REL::ID set must match target machine's versionlib-*.bin`n- Refusing to build if checkout tag differs from pin" | Add-Content $env:GITHUB_STEP_SUMMARY

      # Use the vcpkg preinstalled on windows-2022 (VCPKG_INSTALLATION_ROOT).
      # It is bootstrapped and its binary cache works, unlike the pinned 2022
      # revision which run-vcpkg kept forcing an unsupported x-gha provider on.
      #
      # x64-windows-static-md = VCPKG_LIBRARY_LINKAGE=static + CRT=/MD.
      # The plugin sets CMAKE_MSVC_RUNTIME_LIBRARY to MultiThreadedDLL (/MD),
      # so the deps MUST be static libraries linked INTO the DLL.  With the
      # plain x64-windows triplet fmt/spdlog become separate DLLs, and SKSE
      # then reports "couldn't load plugin 126" unless those DLLs are shipped
      # alongside - the local machine's D:/dev/deps are static .lib precisely
      # for this reason.  Match that in CI: one self-contained DLL, no extras.
      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          Write-Host "Using vcpkg: $vcpkg"
          & $vcpkg version
          & $vcpkg install fmt:x64-windows-static-md spdlog:x64-windows-static-md rapidcsv:x64-windows-static-md --triplet x64-windows-static-md 2>&1 | Tee-Object -FilePath vcpkg-install.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content vcpkg-install.log -Tail 80) -join [Environment]::NewLine
            "### vcpkg install failed`n`n$tail" | Add-Content $env:GITHUB_STEP_SUMMARY
            throw "vcpkg install failed (exit $LASTEXITCODE)"
          }

      - name: Configure
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S IMR -B IMR/build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DIMR_COMMONLIB_DIR="${{ github.workspace }}/CommonLibSSE-NG" `
            -DIMR_DEPS_DIR=""
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed (exit $LASTEXITCODE)" }

      - name: Build
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build IMR/build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Select-String -Pattern 'error C[0-9]|error LNK|fatal error|error:' | Select-Object -First 20 | ForEach-Object {
              $line = ($_.Line -replace '%','%25' -replace '\r','' -replace '\n','%0A')
              Write-Host "::error::$line"
            }
            throw "Build failed (exit $LASTEXITCODE)"
          }

      # The single-DLL contract: no spdlog.dll/fmt.dll may be required at
      # runtime.  With x64-windows-static-md these are .lib linked INTO the
      # DLL, so their names should be absent from the import table.  Fail the
      # build if they are present - that means the triplet was wrong and the
      # user would hit "couldn't load plugin 126" in game.
      - name: Verify single self-contained DLL
        shell: pwsh
        run: |
          $dll = 'IMR/build/Release/InteractiveMusicRadio.dll'
          if (-not (Test-Path $dll)) { throw "Build output missing: $dll" }
          $dumpbin = (Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1).FullName
          if ($dumpbin) {
            $deps = & $dumpbin /dependents $dll | Out-String
            if ($deps -match '(?im)^\s*spdlog\.dll\s*$' -or $deps -match '(?im)^\s*fmt\.dll\s*$') {
              $tail = ($deps -split "`n" | Where-Object { $_ -match 'spdlog|fmt' }) -join "`n"
              "### Bad dynamic dependency`n$tail" | Add-Content $env:GITHUB_STEP_SUMMARY
              throw "DLL still imports spdlog.dll/fmt.dll - triplet must be static; refusing to publish"
            }
            "### Single-DLL check`n- No spdlog.dll/fmt.dll in import table: OK" | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host "dumpbin not found; skipping import-table check"
          }

      - name: Test (Chinese build)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          & ./IMR/build/Release/InteractiveMusicRadioTests.exe 2>&1 | Tee-Object -FilePath test-zh.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content test-zh.log | ForEach-Object {
              $line = ($_ -replace '%','%25' -replace '\r','')
              Write-Host "::error::$line"
            }
            throw "Chinese build tests failed (exit $LASTEXITCODE)"
          }

      - name: Test (English build)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          & ./IMR/build/Release/InteractiveMusicRadioTests_en.exe 2>&1 | Tee-Object -FilePath test-en.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content test-en.log | ForEach-Object {
              $line = ($_ -replace '%','%25' -replace '\r','')
              Write-Host "::error::$line"
            }
            throw "English build tests failed (exit $LASTEXITCODE)"
          }

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveMusicRadio-2.3-clib${{ env.COMMONLIB_VERSION }}-static
          path: |
            IMR/build/Release/InteractiveMusicRadio.dll
            IMR/build/Release/InteractiveMusicRadio_en.dll
            IMR/build/Release/InteractiveMusicRadio.pdb
            IMR/build/Release/InteractiveMusicRadio_en.pdb
          if-no-files-found: error

      # Public release asset: downloadable without a token, so deployment is
      # possible even when local credential/curl combos are blocked.
      - name: Publish DLLs to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autobuild-clib${{ env.COMMONLIB_VERSION }}-static
          name: Autobuild (CommonLibSSE-NG ${{ env.COMMONLIB_VERSION }}, static single DLL)
          body: |
            Auto-built from master. CommonLibSSE-NG ${{ env.COMMONLIB_VERSION }}
            (${{ env.COMMONLIB_REF }}), REL::ID set must match target machine's
            versionlib-*.bin. Dependencies (fmt/spdlog) are linked statically via
            the x64-windows-static-md triplet - this is ONE self-contained DLL,
            no extra DLLs needed. Do not bump CLIB without re-validating in game.
          files: |
            IMR/build/Release/InteractiveMusicRadio.dll
            IMR/build/Release/InteractiveMusicRadio_en.dll
          fail_on_unmatched_files: true
