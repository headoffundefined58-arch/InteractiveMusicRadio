; InteractiveMusicRadio configuration (2.3).
; ';' starts a comment; [sections] are ignored.
; Most of these keys are set from the in-game panel and saved back here.

; Master switch: 1 = plugin active, 0 = off (no session control, no handshake).
bEnabled=1

; When linked, duck (rather than fully mute) the linked source while the player
; is in dialogue.  0 = mute, 1 = no duck.
bDuckInDialogue=1
fDialogueDuck=0.35
fLocalDuck=1.0

; Poll intervals in ms.  The engine frame is 16 ms and is woken by UI
; commands; the panel snapshot is pushed at 10 Hz, so lyrics stay on the
; beat regardless of these values.
iSessionPollMs=500
iTrackPollMs=500

; ---- Launcher hotkey -----------------------------------------------------
; There is NO hardcoded Ctrl / system-menu binding any more.  Click "热键" in
; the panel, press any key (optionally with Ctrl/Shift/Alt), and it is saved
; here.  GetIDCode() is a DIRECTINPUT SCAN CODE, not a virtual key.
;   F1=59 ... F10=68, F11=87, F12=88, Esc=1, Space=57, Enter=28
;   Q=16 W=17 E=18 ... A=30 S=31 D=32 ... Z=44 X=45 C=46
; iHotkeyMods is a sum: 1=Ctrl 2=Shift 4=Alt (0 = plain key)
; Esc always closes the panel and cannot be bound.
iHotkeyKey=68
iHotkeyMods=0

; ---- Draggable panel -----------------------------------------------------
; Offset from the centred default, in pixels.  Drag the header in game.
iPanelX=0
iPanelY=0

; ---- Two independent desktop lyric windows -------------------------------
; [0] desktop player, [1] web player.  -1 = automatic position (bottom
; centre / slightly above for the web one).  Locked = click-through;
; unlock in-game to drag the window, then lock it again.
iLyricDesktopX=-1
iLyricDesktopY=-1
iLyricWebX=-1
iLyricWebY=-1
bLyricDesktopLocked=1
bLyricWebLocked=1

; Show the lyric window as soon as the plugin starts.
bLyricsOnStart=0

; Look lyrics up online (best effort, one request per track).  0 = off.
bFetchLyrics=1

; Desktop lyric text size in pixels.
iLyricFontSize=30

; Manual lyric sync nudge in ms (the +/- buttons in the settings row).
; Positive = lyrics later, negative = lyrics earlier.
iLyricOffsetMs=0

; ---- Video subtitles (web player only) -----------------------------------
; With a web player linked AND desktop lyrics ON, IMR grabs the browser's
; video frame and OCRs the bottom strip for its subtitles (MV lyrics, show
; captions).  The recognised line overrides the network lyric; when capture
; is unavailable or goes stale, the network lyric takes over again.
; Needs Windows OCR language support (Simplified Chinese recommended).
bVideoSubtitles=1
iVideoSubIntervalMs=400       ; OCR cadence, ms (min 120, max 2000)
iVideoSubCropBottomPct=38     ; bottom strip of the video that holds subtitles

; 1 = emit trace/debug lines into InteractiveMusicRadio.log.
bVerbose=1
