<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="IMR Interactive Music Radio logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2b2b"/>
      <stop offset="1" stop-color="#061616"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee6b4"/>
      <stop offset="1" stop-color="#17a886"/>
    </linearGradient>
  </defs>

  <!-- rounded square tile -->
  <rect x="8" y="8" width="224" height="224" rx="48" fill="url(#bg)"/>
  <rect x="8" y="8" width="224" height="224" rx="48" fill="none" stroke="#17a886" stroke-opacity="0.5" stroke-width="2"/>

  <!-- broadcast arcs (radio waves) -->
  <g fill="none" stroke="url(#teal)" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M 78 118 A 52 52 0 0 1 162 118"/>
    <path d="M 64 138 A 72 72 0 0 1 176 138"/>
  </g>

  <!-- the IMR monogram -->
  <g fill="url(#teal)">
    <!-- I -->
    <rect x="78" y="66" width="16" height="108" rx="8"/>
    <!-- M -->
    <path d="M 108 174 L 108 66 L 128 96 L 148 66 L 148 174 L 132 174 L 132 106 L 128 112 L 116 112 L 112 106 L 112 174 Z"/>
    <!-- R -->
    <path d="M 164 174 L 164 66 L 190 66 A 26 26 0 0 1 190 118 L 194 174 L 178 174 L 175 122 L 164 122 L 164 174 Z"/>
    <!-- R bowl inner cut -->
    <rect x="164" y="82" width="14" height="20" rx="6" fill="#061616"/>
  </g>
</svg>
